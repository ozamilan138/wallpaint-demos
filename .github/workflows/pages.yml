name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'

      - name: Build each demo into its own subfolder
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p _site
          for dir in aureline-atelier the-transformation colour-studio \
                     truecoat-trusted truecoat-transformations truecoat-paint-plan \
                     truecoat-complete truecoat-homes truecoat-your-colours; do
            echo "::group::$dir"
            (cd "$dir" && npm ci --no-audit --no-fund \
              && npm run build -- --base="/$REPO/$dir/" --outDir "../_site/$dir" --emptyOutDir)
            echo "::endgroup::"
          done
          cp site/index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

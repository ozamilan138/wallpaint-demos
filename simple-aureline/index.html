<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      The build (scripts/build.mjs) makes one page for each language from this file.
      It replaces the title and the description, and it puts the search engine tags at the seo-tags comment.
      The addresses in those tags come from src/config/site.ts.
    -->
    <title>House Painter in Ahmedabad | Maruti Paint House</title>
    <meta name="description" content="Maruti Paint House is a house painter in Ahmedabad." />
    <!--seo-tags-->
    <script>
      // On the English page only: open the language page of the visitor, if it is Hindi or Gujarati.
      // The order: an old ?lang= link, then the last choice on this device, then the language of the browser.
      // The key 'lang' is the same as STORAGE_KEY in src/i18n/context.ts.
      ;(function () {
        if (document.documentElement.lang !== 'en') return
        var path = location.pathname.replace(/index\.html$/, '')
        if (path.slice(-1) !== '/') path += '/'
        // The development server shows this file on every address, so stop if this is already a language page.
        if (/\/(hi|gu)\/$/.test(path)) return
        var want = new URLSearchParams(location.search).get('lang')
        if (!want) {
          try {
            want = localStorage.getItem('lang')
          } catch (e) {}
        }
        if (!want) {
          var tags = navigator.languages || [navigator.language || '']
          for (var i = 0; i < tags.length; i++) {
            var code = String(tags[i]).toLowerCase().split('-')[0]
            if (code === 'en' || code === 'hi' || code === 'gu') {
              want = code
              break
            }
          }
        }
        if (want !== 'hi' && want !== 'gu') return
        location.replace(path + want + '/' + location.hash)
      })()
    </script>
    <meta name="theme-color" content="#F8F6F1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The Noto fonts are for Hindi and Gujarati. The browser downloads them only when the page shows those letters. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;500;600&family=Noto+Serif+Devanagari:wght@500;600&family=Noto+Serif+Gujarati:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-living-1600.webp"
      imagesrcset="/images/hero-living-640.webp 640w, /images/hero-living-1024.webp 1024w, /images/hero-living-1600.webp 1600w, /images/hero-living-2000.webp 2000w"
      imagesizes="(min-width: 1024px) 46vw, 100vw"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
